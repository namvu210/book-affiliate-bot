<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Threads — Connecting...</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
  .card { background: #fff; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; }
  h2 { margin-bottom: 12px; }
  .spinner { border: 3px solid #eee; border-top: 3px solid #000; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 16px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin: 8px 0; }
  button { padding: 10px 24px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:hover { opacity: 0.85; }
  .error { color: #c53030; }
</style>
</head>
<body>
<div class="card">
  <div id="auto">
    <h2>Connecting Threads...</h2>
    <div class="spinner"></div>
    <p>Redirecting to your app server...</p>
  </div>
  <div id="manual" style="display:none">
    <h2>Enter your server URL</h2>
    <p style="font-size:13px;color:#666;margin-bottom:12px">Could not auto-redirect. Paste your server URL below:</p>
    <input type="text" id="serverUrl" placeholder="https://localhost:8000" value="https://localhost:8000" />
    <br>
    <button onclick="doRedirect()">Connect</button>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');

if (error) {
  document.getElementById('auto').innerHTML = '<h2 class="error">❌ Authorization failed</h2><p>' + (params.get('error_message') || error) + '</p>';
} else if (code) {
  const server = 'https://localhost:8000';
  window.location.href = server + '/callback/threads?code=' + encodeURIComponent(code);
} else {
  document.getElementById('auto').innerHTML = '<h2 class="error">❌ No authorization code received</h2>';
}

function doRedirect() {
  var server = document.getElementById('serverUrl').value.replace(/\/+$/, '');
  if (!server) return;
  window.location.href = server + '/callback/threads?code=' + encodeURIComponent(code);
}
</script>
</body>
</html>
