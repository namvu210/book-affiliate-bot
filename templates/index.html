<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Book Affiliate Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin: 20px 0; font-size: 1.8em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .tabs { display: flex; gap: 0; margin-bottom: 0; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: #e0e0e0; border: none; font-size: 1em; font-weight: 600; transition: all .2s; }
        .tab.active { background: #fff; color: #e94560; border-bottom: 3px solid #e94560; }
        .panel { display: none; background: #fff; padding: 24px; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .panel.active { display: block; }
        label { display: block; font-weight: 600; margin: 12px 0 4px; }
        input[type="text"], input[type="url"], textarea, select { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: .95em; }
        textarea { resize: vertical; min-height: 80px; }
        input[type="file"] { margin: 8px 0; }
        .btn { display: inline-block; padding: 12px 28px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .btn:hover { background: #c73e54; }
        .btn:disabled { background: #ccc; cursor: wait; }
        #result { margin-top: 30px; }
        .result-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .result-card h3 { color: #e94560; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .result-card pre { background: #f8f9fa; padding: 14px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; font-size: .9em; line-height: 1.6; }
        .copy-btn { background: #16213e; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: .8em; float: right; }
        .copy-btn:hover { background: #0f3460; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { background: #e8f4f8; color: #0f3460; padding: 4px 10px; border-radius: 20px; font-size: .85em; }
        .spinner { display: none; text-align: center; padding: 40px; }
        .spinner.show { display: block; }
        .spinner::after { content: ''; display: inline-block; width: 40px; height: 40px; border: 4px solid #e94560; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .book-meta { background: #f8f9fa; padding: 14px; border-radius: 8px; margin-bottom: 16px; }
        .book-meta strong { color: #e94560; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Book Affiliate Bot</h1>
    <p class="subtitle">Upload sách PDF hoặc dán link Shopee → Tự động tạo review & bài đăng</p>

    <div style="background:#fff;padding:10px 20px;border-radius:8px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:.85em">🤖 Model:</span>
        <select id="gemini-model" onchange="fetch('/api/set-model?model='+this.value)" style="padding:6px 10px;border-radius:6px;border:1.5px solid #ddd;font-size:.85em">
            <option>Đang tải...</option>
        </select>
    </div>
    <script>
    fetch('/api/models').then(r=>r.json()).then(d=>{
        var sel=document.getElementById('gemini-model');
        sel.innerHTML='';
        var models = d.models||[];
        models.forEach(function(m){
            var opt=document.createElement('option');
            opt.value=m;opt.textContent=m;
            if(m.indexOf('flash-lite')>=0) opt.selected=true;
            sel.appendChild(opt);
        });
    });
    </script>

    <div style="background:#fff;padding:12px 20px;border-radius:8px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <span style="font-size:.9em">🎙️ Voice Clone:</span>
            <span id="voice-badge" style="font-size:.85em;color:#666">Đang kiểm tra...</span>
        </div>
        <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:8px">
            <div>
                <label style="font-size:.8em;color:#666">File giọng (6-30s):</label>
                <input type="file" id="voice-file" accept="audio/*,.wav,.mp3,.m4a" style="font-size:.85em">
            </div>
            <div style="flex:1;min-width:200px">
                <label style="font-size:.8em;color:#666">Nội dung đang nói trong file:</label>
                <input type="text" id="voice-ref-text" placeholder="Gõ lại nội dung trong file giọng mẫu..." style="padding:6px 10px;border:1.5px solid #ddd;border-radius:6px;width:100%;font-size:.85em">
            </div>
            <button class="btn" onclick="uploadVoice()" style="padding:6px 16px;font-size:.85em">💾 Lưu</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab" data-tab="pdf" onclick="switchTab('pdf')">📄 Upload PDF</button>
        <button class="tab active" data-tab="url" onclick="switchTab('url')">🔗 Link Shopee</button>
        <button class="tab" data-tab="manual" onclick="switchTab('manual')">✏️ Nhập tay</button>
    </div>

    <!-- PDF Upload -->
    <div id="panel-pdf" class="panel">
        <form id="form-pdf" enctype="multipart/form-data">
            <label>File PDF sách:</label>
            <input type="file" name="file" accept=".pdf" required>
            <label>Đối tượng:</label>
            <select name="audience">
                {% for key, val in audiences.items() %}
                <option value="{{ key }}">{{ val.name }}</option>
                {% endfor %}
            </select>
            <label>Độ dài review: <span id="wc-pdf-val">150</span> từ</label>
            <input type="range" name="word_count" min="50" max="200" value="150" oninput="document.getElementById('wc-pdf-val').textContent=this.value">
            <button type="submit" class="btn">🚀 Tạo Review</button>
        </form>
    </div>

    <!-- Shopee URL -->
    <div id="panel-url" class="panel active">
        <form id="form-url" enctype="multipart/form-data">
            <label>Link sản phẩm Shopee:</label>
            <div style="display:flex;gap:8px">
                <input type="url" name="url" placeholder="https://shopee.vn/..." required style="flex:1">
                <button type="button" class="btn" onclick="suggestPersonas()" style="padding:8px 16px;font-size:.85em;white-space:nowrap">🎯 Gợi ý khách hàng</button>
            </div>
            <label>Link affiliate (tuỳ chọn):</label>
            <input type="url" name="affiliate_url" placeholder="https://s.shopee.vn/... (link affiliate của bạn)">
            <label>Đối tượng khách hàng:</label>
            <div id="persona-list">
                <select name="audience" id="audience-select" onchange="document.getElementById('custom-persona').style.display=this.value==='custom'?'block':'none'">
                    {% for key, val in audiences.items() %}
                    <option value="{{ key }}">{{ val.name }}</option>
                    {% endfor %}
                    <option value="custom">✏️ Tự nhập...</option>
                </select>
            </div>
            <div id="custom-persona" style="display:none;margin-top:8px;padding:12px;background:#f8f9fa;border-radius:8px">
                <input type="text" id="cp-name" placeholder="Tên nhóm KH (VD: Sinh viên đại học)" style="margin-bottom:6px">
                <input type="text" id="cp-tone" placeholder="Giọng văn (VD: trẻ trung, năng động)" style="margin-bottom:6px">
                <input type="text" id="cp-focus" placeholder="Trọng tâm (VD: giá rẻ, tiện lợi)" >
            </div>
            <input type="hidden" name="custom_audience" id="custom-audience-json" value="">
            <label>Độ dài review:</label>
            <div style="display:flex;gap:16px;flex-wrap:wrap">
                <label style="font-size:.85em">📘 Facebook: <span id="wc-url-fb">150</span> từ
                    <input type="range" name="word_count_fb" min="50" max="300" value="150" oninput="document.getElementById('wc-url-fb').textContent=this.value">
                </label>
                <label style="font-size:.85em">🎵 TikTok: <span id="wc-url-tk">80</span> từ
                    <input type="range" name="word_count_tk" min="30" max="150" value="80" oninput="document.getElementById('wc-url-tk').textContent=this.value">
                </label>
            </div>
            <button type="submit" class="btn">🚀 Tạo Review</button>
        </form>
    </div>

    <!-- Manual -->
    <div id="panel-manual" class="panel">
        <form id="form-manual">
            <label>Tên sách:</label>
            <input type="text" name="title" placeholder="VD: Đắc Nhân Tâm" required>
            <label>Tác giả:</label>
            <input type="text" name="author" placeholder="VD: Dale Carnegie">
            <label>Mô tả / Nội dung chính:</label>
            <textarea name="description" placeholder="Tóm tắt nội dung sách..."></textarea>
            <label>Đối tượng:</label>
            <select name="audience">
                {% for key, val in audiences.items() %}
                <option value="{{ key }}">{{ val.name }}</option>
                {% endfor %}
            </select>
            <label>Nền tảng:</label>
            <select name="platform">
                <option value="facebook">Facebook</option>
                <option value="tiktok">TikTok</option>
            </select>
            <button type="submit" class="btn">🚀 Tạo Review</button>
        </form>
    </div>

    <div class="spinner" id="spinner">
        <p style="margin-top:12px; color:#666;">Đang tạo review... (15-30 giây)</p>
    </div>

    <div id="result"></div>
</div>

<script>
function switchTab(name) {
    // Remove active from all tabs and panels
    var tabs = document.getElementsByClassName('tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].className = 'tab';
    var panels = document.getElementsByClassName('panel');
    for (var i = 0; i < panels.length; i++) panels[i].className = 'panel';
    // Activate selected
    var tab = document.querySelector('[data-tab="' + name + '"]');
    if (tab) tab.className = 'tab active';
    var panel = document.getElementById('panel-' + name);
    if (panel) panel.className = 'panel active';
}

function copyText(id) {
    const el = document.getElementById(id);
    const text = el.value || el.textContent;
    navigator.clipboard.writeText(text);
    const btn = el.closest('.result-card').querySelector('.copy-btn');
    btn.textContent = '✅ Đã copy!';
    setTimeout(() => btn.textContent = '📋 Copy', 1500);
}

var _elVoicesLoaded = false;
function toggleELVoices(sel, platform) {
    var elSel = document.getElementById('el-voice-' + platform);
    if (sel.value === 'elevenlabs') {
        elSel.style.display = '';
        if (!_elVoicesLoaded) {
            elSel.innerHTML = '<option value="">Đang tải giọng...</option>';
            fetch('/api/elevenlabs-voices').then(function(r){ return r.json(); }).then(function(d){
                _elVoicesLoaded = true;
                var allSels = document.querySelectorAll('[id^="el-voice-"]');
                for (var i = 0; i < allSels.length; i++) {
                    var s = allSels[i];
                    s.innerHTML = '';
                    var voices = d.voices || [];
                    for (var j = 0; j < voices.length; j++) {
                        var v = voices[j];
                        var opt = document.createElement('option');
                        opt.value = v.id;
                        opt.textContent = v.name + (v.category ? ' (' + v.category + ')' : '');
                        s.appendChild(opt);
                    }
                    if (voices.length === 0) s.innerHTML = '<option value="">Không có giọng</option>';
                }
            }).catch(function(e){
                elSel.innerHTML = '<option value="">Lỗi: ' + e.message + '</option>';
            });
        }
    } else {
        elSel.style.display = 'none';
    }
}

async function generateSpeech(platform) {
    const textarea = document.getElementById('post-' + platform);
    const text = textarea.value.trim();
    if (!text) { alert('Nhập nội dung trước!'); return; }
    const voiceType = document.getElementById('voice-' + platform)?.value || 'gtts';
    const btn = document.getElementById('btn-speech-' + platform);
    const audioDiv = document.getElementById('audio-' + platform);
    btn.disabled = true;
    btn.textContent = '⏳ Đang tạo...';
    try {
        const fd = new FormData();
        fd.append('text', text);
        fd.append('platform', platform);
        fd.append('voice_type', voiceType);
        var elVoiceSel = document.getElementById('el-voice-' + platform);
        if (voiceType === 'elevenlabs' && elVoiceSel?.value) fd.append('elevenlabs_voice_id', elVoiceSel.value);
        const resp = await fetch('/generate-speech', { method: 'POST', body: fd });
        if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Lỗi'); }
        const data = await resp.json();
        audioDiv.innerHTML = `<audio controls style="height:36px"><source src="${data.audio_url}" type="audio/mpeg"></audio><a href="${data.audio_url}" download style="font-size:.85em;margin-left:4px">⬇️</a>`;
        if (window._lastReviewData && window._lastReviewData[platform]) {
            window._lastReviewData[platform].audio_url = data.audio_url;
            window._lastReviewData[platform].social_post = text;
        }
    } catch(e) {
        audioDiv.innerHTML = `<span style="color:red;font-size:.85em">❌ ${e.message}</span>`;
    } finally {
        btn.disabled = false;
        btn.textContent = '🔊 Tạo giọng nói';
    }
}

async function uploadVoice() {
    const file = document.getElementById('voice-file').files[0];
    if (!file) { alert('Chọn file giọng mẫu trước!'); return; }
    const refText = document.getElementById('voice-ref-text').value.trim();
    const badge = document.getElementById('voice-badge');
    badge.textContent = '⏳ Đang upload...';
    try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('ref_text', refText);
        const resp = await fetch('/upload-voice', { method: 'POST', body: fd });
        const data = await resp.json();
        badge.textContent = resp.ok ? '✅ Đã lưu mẫu giọng' : '❌ Lỗi';
    } catch(e) { badge.textContent = '❌ ' + e.message; }
}
fetch('/api/voice-status').then(r=>r.json()).then(d=>{
    document.getElementById('voice-badge').textContent = d.has_voice ? '✅ Đã có mẫu giọng' : '⚠️ Upload WAV/MP3 (6-30s) để clone giọng';
}).catch(()=>{});

function previewUploads(input) {
    const preview = document.getElementById('upload-preview');
    preview.innerHTML = '';
    const dt = new DataTransfer();
    Array.from(input.files).forEach((file, i) => {
        dt.items.add(file);
        const div = document.createElement('div');
        div.style.cssText = 'position:relative;display:inline-block';
        if (file.type.startsWith('video/')) {
            const vid = document.createElement('video');
            vid.src = URL.createObjectURL(file);
            vid.style.cssText = 'height:80px;border-radius:6px';
            vid.controls = true;
            div.appendChild(vid);
        } else {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.style.cssText = 'height:80px;border-radius:6px';
            div.appendChild(img);
        }
        const btn = document.createElement('button');
        btn.textContent = '✕';
        btn.style.cssText = 'position:absolute;top:-6px;right:-6px;background:#e94560;color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:20px;padding:0';
        btn.onclick = () => { div.remove(); removeFile(input, i); };
        div.appendChild(btn);
        preview.appendChild(div);
    });
}

function removeFile(input, index) {
    const dt = new DataTransfer();
    Array.from(input.files).forEach((f, i) => { if (i !== index) dt.items.add(f); });
    input.files = dt.files;
    previewUploads(input);
}

function renderResult(data) {
    const r = document.getElementById('result');
    let html = '';

    // Book info
    if (data.book) {
        html += `<div class="book-meta">
            <strong>📖 ${data.book.title}</strong> — ${data.book.author}
            ${data.book.price ? ' | 💰 ' + data.book.price : ''}
            ${data.book.rating ? ' | ⭐ ' + data.book.rating + '/5 (' + data.book.rating_count + ' đánh giá)' : ''}
            ${data.book.review_count_used ? ' | 💬 ' + data.book.review_count_used + ' nhận xét thực được phân tích' : ''}
            ${data.book.shopee_url ? ' | <a href="' + data.book.shopee_url + '" target="_blank">🛒 Shopee</a>' : ''}
        </div>`;
    }

    // Product images gallery with selection
    const imgs = data.product_images || data.product_images_original || [];
    const localImgs = data.product_images || [];
    if (imgs.length > 0) {
        html += `<div class="result-card">
            <h3>🖼️ Ảnh & Video sản phẩm (${imgs.length})</h3>
            <div style="margin-bottom:10px">
                <label style="display:inline;font-weight:normal;cursor:pointer">
                    <input type="checkbox" id="select-all-imgs" onchange="toggleAllImages(this.checked)"> Chọn tất cả
                </label>
                <button class="btn" onclick="downloadSelectedImages()" style="padding:6px 16px;font-size:.85em;margin:0 0 0 12px">⬇️ Tải ảnh đã chọn</button>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:12px;padding:10px 0" id="image-gallery">
                ${imgs.map((img, i) => {
                    const local = localImgs[i] || '';
                    const isVideo = img.match(/\.(mp4|mov|webm)/i);
                    return `<div style="position:relative;flex-shrink:0">
                        <input type="checkbox" class="img-check" data-url="${local || img}" data-index="${i}"
                               style="position:absolute;top:6px;left:6px;width:20px;height:20px;z-index:2;cursor:pointer">
                        ${isVideo
                            ? `<video src="${local || img}" style="height:180px;border-radius:8px" controls></video>`
                            : `<img src="${local || img}" style="height:180px;border-radius:8px;cursor:pointer;border:2px solid transparent"
                                   onclick="window.open('${local || img}','_blank')" title="Ảnh ${i+1}">`
                        }
                    </div>`;
                }).join('')}
            </div>
        </div>`;
        window._productImages = localImgs.length ? localImgs : imgs;
    }

    // Render platform results
    const platforms = data.facebook ? ['facebook', 'tiktok'] : [null];
    for (const p of platforms) {
        const d = p ? data[p] : data;
        if (!d) continue;
        const label = p === 'tiktok' ? '🎵 TikTok' : '📘 Facebook';
        const postText = d.social_post || d.review || '';

        html += `<div class="result-card">
            <h3>${p ? label : '📝 Review'}
                <button class="copy-btn" onclick="copyText('post-${p||'single'}')">📋 Copy</button>
            </h3>
            <textarea id="post-${p||'single'}" rows="10" style="width:100%;padding:12px;border:1.5px solid #ddd;border-radius:8px;font-size:.9em;line-height:1.6;font-family:inherit;resize:vertical">${postText}</textarea>
            <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <select id="voice-${p||'single'}" style="padding:6px 10px;border-radius:6px;border:1.5px solid #ddd;font-size:.85em" onchange="toggleELVoices(this,'${p||'single'}')">
                    <option value="gtts">🤖 gTTS (nhanh)</option>
                    <option value="vieneu">🇻🇳 VieNeu (tự nhiên)</option>
                    <option value="vieneu-clone">🎙️ Clone giọng (VieNeu)</option>
                    <option value="elevenlabs">🎙️ Clone giọng (ElevenLabs)</option>
                </select>
                <select id="el-voice-${p||'single'}" style="padding:6px 10px;border-radius:6px;border:1.5px solid #ddd;font-size:.85em;display:none">
                    <option value="">Đang tải giọng...</option>
                </select>
                <button class="btn" onclick="generateSpeech('${p||'single'}')" id="btn-speech-${p||'single'}" style="padding:8px 20px;font-size:.9em">
                    🔊 Tạo giọng nói
                </button>
                <div id="audio-${p||'single'}">${d.audio_url ? `<audio controls style="height:36px"><source src="${d.audio_url}" type="audio/mpeg"></audio><a href="${d.audio_url}" download style="font-size:.85em;margin-left:4px">⬇️</a>` : ''}</div>
            </div>
            <div class="tags" style="margin-top:8px">${(d.hashtags||[]).map(t => '<span class="tag">' + t + '</span>').join('')}</div>
        </div>`;

        if (d.hook) {
            html += `<div class="result-card">
                <h3>🎬 Hook (mở đầu video)</h3>
                <pre>${d.hook}</pre>
            </div>`;
        }

        if (d.key_points) {
            html += `<div class="result-card">
                <h3>✨ Điểm nổi bật</h3>
                <ul style="padding-left:20px">${d.key_points.map(p => '<li>' + p + '</li>').join('')}</ul>
            </div>`;
        }
    }

    // Video generation section
    if (data.tiktok || data.facebook) {
        const vidImgs = data.product_images || [];
        html += `<div class="result-card">
            <h3>🎬 Tạo Video</h3>
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
                <select id="video-platform" style="padding:8px 12px;border-radius:8px;border:1.5px solid #ddd">
                    ${data.tiktok ? '<option value="tiktok">🎵 TikTok</option>' : ''}
                    ${data.facebook ? '<option value="facebook">📘 Facebook Reels</option>' : ''}
                    <option value="tiktok">📺 YouTube Shorts</option>
                </select>
                <select id="video-aspect" style="padding:8px 12px;border-radius:8px;border:1.5px solid #ddd">
                    <option value="9:16">📱 9:16 (TikTok/Reels)</option>
                    <option value="1:1">⬜ 1:1 (Instagram)</option>
                    <option value="16:9">🖥️ 16:9 (YouTube)</option>
                </select>
            </div>
            <div style="display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap">
                <label style="font-size:.85em;display:flex;align-items:center;gap:6px">
                    ⏱️ Thời lượng: <span id="dur-val">30</span>s
                    <input type="range" id="video-duration" min="15" max="60" value="30" step="5" style="width:100px" oninput="document.getElementById('dur-val').textContent=this.value">
                </label>
                <label style="font-size:.85em;display:flex;align-items:center;gap:6px">

async function submitForm(url, formData) {
    document.getElementById('spinner').classList.add('show');
    document.getElementById('result').innerHTML = '';
    try {
        const resp = await fetch(url, { method: 'POST', body: formData });
        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.detail || 'Lỗi server');
        }
        const data = await resp.json();
        window._lastPdfPath = data._pdf_path || '';
        renderResult(data);
    } catch (e) {
        document.getElementById('result').innerHTML =
            `<div class="result-card" style="border-left:4px solid red"><h3>❌ Lỗi</h3><pre>${e.message}</pre></div>`;
    } finally {
        document.getElementById('spinner').classList.remove('show');
    }
}

document.getElementById('form-url').addEventListener('submit', e => {

            focus: document.getElementById('cp-focus').value || 'chất lượng sản phẩm',
        });

        caField.value = sel.options[sel.selectedIndex].dataset.persona || '';

    submitForm('/from-url', new FormData(e.target));
});

async function suggestPersonas() {
    const urlInput = document.querySelector('#panel-url input[name="url"]');
    const url = urlInput?.value?.trim();
    if (!url) { alert('Nhập link Shopee trước!'); return; }
    const slug = decodeURIComponent(url.split('shopee.vn/')[1] || '').split('-i.')[0].replace(/-/g, ' ');
    const sel = document.getElementById('audience-select');
    sel.innerHTML = '<option disabled selected>⏳ Đang gợi ý...</option>';
    try {
        const fd = new FormData();
        fd.append('title', slug);
        const resp = await fetch('/suggest-personas', { method: 'POST', body: fd });
        if (!resp.ok) throw new Error('API error');
        const data = await resp.json();
        let opts = '';
        (data.personas || []).forEach((p, i) => {
            const pJson = JSON.stringify(p).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
            opts += `<option value="suggested-${i}" data-persona="${pJson}" ${i===0?'selected':''}>🎯 ${p.name}</option>`;
        });
        opts += `<optgroup label="── Mặc định ──">`;
        opts += `<option value="phu-huynh-lop-5">Phụ huynh có con lớp 5</option>`;
        opts += `<option value="phu-huynh-mam-non">Phụ huynh có con mầm non</option>`;
        opts += `<option value="hoc-sinh-thpt">Học sinh THPT</option>`;
        opts += `</optgroup>`;
        opts += `<option value="custom">✏️ Tự nhập...</option>`;
        sel.innerHTML = opts;
        document.getElementById('custom-persona').style.display = 'none';
    } catch(e) {
        sel.innerHTML = `<option value="phu-huynh-lop-5">Phụ huynh có con lớp 5</option><option value="phu-huynh-mam-non">Phụ huynh có con mầm non</option><option value="hoc-sinh-thpt">Học sinh THPT</option><option value="custom">✏️ Tự nhập...</option>`;
    }
}

async function fetchImages() {
    const urlInput = document.querySelector('#panel-url input[name="url"]');
    const url = urlInput?.value?.trim();
    if (!url) { alert('Nhập link Shopee trước!'); return; }
    document.getElementById('spinner').classList.add('show');
    document.getElementById('result').innerHTML = '';
    try {
        const fd = new FormData();
        fd.append('url', url);
        const resp = await fetch('/fetch-images', { method: 'POST', body: fd });
        if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Lỗi'); }
        const data = await resp.json();
        let html = `<div class="book-meta">
            <strong>📖 ${data.title || ''}</strong>
            ${data.price ? ' | 💰 ' + data.price : ''}
            ${data.rating ? ' | ⭐ ' + data.rating + '/5' : ''}
        </div>`;
        const imgs = data.product_images || [];
        if (imgs.length > 0) {
            html += `<div class="result-card">
                <h3>🖼️ Ảnh & Video sản phẩm (${imgs.length})</h3>
                <div style="margin-bottom:10px">
                    <label style="display:inline;font-weight:normal;cursor:pointer">
                        <input type="checkbox" id="select-all-imgs" onchange="toggleAllImages(this.checked)"> Chọn tất cả
                    </label>
                    <button class="btn" onclick="downloadSelectedImages()" style="padding:6px 16px;font-size:.85em;margin:0 0 0 12px">⬇️ Tải ảnh đã chọn</button>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:12px;padding:10px 0">
                    ${imgs.map((img, i) => {
                        const isVideo = img.match(/\.mp4/i);
                        return `<div style="position:relative">
                            <input type="checkbox" class="img-check" data-url="${img}" data-index="${i}"
                                   style="position:absolute;top:6px;left:6px;width:20px;height:20px;z-index:2;cursor:pointer">
                            ${isVideo
                                ? `<video src="${img}" style="height:180px;border-radius:8px" controls></video>`
                                : `<img src="${img}" style="height:180px;border-radius:8px;cursor:pointer"
                                       onclick="window.open('${img}','_blank')">`
                            }
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
        } else {
            html += `<div class="result-card"><p>Không tìm thấy ảnh. Kiểm tra lại cookies Shopee.</p></div>`;
        }
        document.getElementById('result').innerHTML = html;
    } catch(e) {
        document.getElementById('result').innerHTML =
            `<div class="result-card" style="border-left:4px solid red"><h3>❌ Lỗi</h3><pre>${e.message}</pre></div>`;
    } finally {
        document.getElementById('spinner').classList.remove('show');
    }
}

function toggleAllImages(checked) {
    document.querySelectorAll('.img-check').forEach(cb => cb.checked = checked);

function downloadSelectedImages() {
    const checked = document.querySelectorAll('.img-check:checked');
    if (checked.length === 0) { alert('Chọn ít nhất 1 ảnh để tải!'); return; }
    checked.forEach(cb => {
        const url = cb.dataset.url;
        const i = cb.dataset.index;
        const a = document.createElement('a');
        a.href = url;
        a.download = `product_${i}.jpg`;
        document.body.appendChild(a); a.click(); a.remove();
    });
}

async function loadMusicList(category, query, refresh) {
    try {
        const q = query || document.getElementById('music-search')?.value || '';
        const cat = category || '';
        const src = document.getElementById('music-source')?.value || 'freesound';
        const r = refresh ? '&refresh=true' : '';
        const resp = await fetch(`/api/music?category=${encodeURIComponent(cat)}&q=${encodeURIComponent(q)}&source=${src}${r}`);
        const data = await resp.json();
        const sel = document.getElementById('music-select');
        const catSel = document.getElementById('music-category');
        if (!sel) return;
        sel.innerHTML = '<option value="">Không nhạc nền</option>';
        if (data.error) {
            sel.innerHTML += `<option disabled>⚠️ ${data.error}</option>`;
        }
        (data.tracks || []).forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.url;
            opt.textContent = `🎵 ${t.name}${t.duration ? ' (' + Math.round(t.duration) + 's)' : ''}`;
            sel.appendChild(opt);
        });
        if (catSel.options.length <= 1 && data.categories) {
            data.categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
                catSel.appendChild(opt);
            });
        }
    } catch(e) {}
}

function limitVideoImages(cb) {

        if (img) img.style.borderColor = c.checked ? '#e94560' : 'transparent';
    });

function previewVideoUploads(input) {
    var preview = document.getElementById('video-upload-preview');
    preview.innerHTML = '';
    Array.from(input.files).forEach(function(file, i) {
        var div = document.createElement('div');
        div.style.cssText = 'position:relative;display:inline-block';
        if (file.type.startsWith('video/')) {
            var vid = document.createElement('video');
            vid.src = URL.createObjectURL(file);
            vid.style.cssText = 'height:80px;border-radius:6px';
            vid.controls = true;
            div.appendChild(vid);
        } else {
            var img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.style.cssText = 'height:80px;border-radius:6px;border:2px solid #e94560';
            div.appendChild(img);
        }
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'vid-upload-check';
        cb.checked = true;
        cb.dataset.index = i;
        cb.style.cssText = 'position:absolute;top:4px;left:4px;width:18px;height:18px;z-index:2';
        div.insertBefore(cb, div.firstChild);
        var btn = document.createElement('button');
        btn.textContent = '✕';
        btn.style.cssText = 'position:absolute;top:-6px;right:-6px;background:#e94560;color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:20px;padding:0;z-index:3';
        btn.onclick = function() {
            div.remove();
            removeVideoFile(input, i);
        };
        div.appendChild(btn);
        preview.appendChild(div);
    });
}

function removeVideoFile(input, index) {
    var dt = new DataTransfer();
    Array.from(input.files).forEach(function(f, i) { if (i !== index) dt.items.add(f); });
    input.files = dt.files;
    previewVideoUploads(input);
}

function getVideoFormData() {
    const platform = document.getElementById('video-platform').value;
    const selected = Array.from(document.querySelectorAll('.vid-img-check:checked')).map(c => c.value);
    const textarea = document.getElementById('post-' + platform);
    if (textarea && window._lastReviewData?.[platform]) window._lastReviewData[platform].social_post = textarea.value;
    const fd = new FormData();
    fd.append('review_json', JSON.stringify(window._lastReviewData));
    fd.append('pdf_path', window._lastPdfPath || '');
    fd.append('platform', platform);
    fd.append('selected_images', JSON.stringify(selected));
    fd.append('max_duration', document.getElementById('video-duration')?.value || '30');
    fd.append('music_volume', document.getElementById('music-volume')?.value || '15');
    fd.append('aspect_ratio', document.getElementById('video-aspect')?.value || '9:16');
    fd.append('voice_speed', document.getElementById('voice-speed')?.value || '75');
    fd.append('img_transition', document.getElementById('img-transition')?.value || '3');
    fd.append('subtitle_style', document.getElementById('subtitle-style')?.value || 'tiktok');
    fd.append('highlight_color', document.getElementById('highlight-color')?.value || '#FFD700');
    fd.append('img_effect', document.getElementById('img-effect')?.value || 'ken_burns');
    fd.append('zoom_ratio', document.getElementById('zoom-ratio')?.value || '15');
    fd.append('show_intro', document.getElementById('show-intro')?.checked ? '1' : '0');
    fd.append('show_outro', document.getElementById('show-outro')?.checked ? '1' : '0');
    const introBg = document.getElementById('intro-bg')?.files?.[0];
    if (introBg) fd.append('intro_bg', introBg);
    const outroBg = document.getElementById('outro-bg')?.files?.[0];
    if (outroBg) fd.append('outro_bg', outroBg);
    const logoFile = document.getElementById('video-logo')?.files?.[0];
    if (logoFile) fd.append('logo', logoFile);
    fd.append('logo_position', document.getElementById('logo-position')?.value || 'top-right');
    const musicSel = document.getElementById('music-select');
    const customUrl = document.getElementById('custom-music-url')?.value?.trim();
    const customFile = document.getElementById('custom-music-file')?.files?.[0];
    if (customFile) fd.append('music_upload', customFile);
    else if (customUrl) fd.append('music_file', customUrl);
    else if (musicSel?.value) fd.append('music_file', musicSel.value);
    const uploadEl = document.getElementById('video-media-upload');
    if (uploadEl?.files) {
        const checked = new Set();
        document.querySelectorAll('.vid-upload-check:checked').forEach(cb => checked.add(parseInt(cb.dataset.index)));
        for (let i = 0; i < Math.min(uploadEl.files.length, 8); i++) {
            if (checked.size === 0 || checked.has(i)) fd.append('media', uploadEl.files[i]);
        }
    }
    document.getElementById('music-preview')?.pause();
    return { fd, platform };
}

async function previewVideo() {
    const btn = document.getElementById('btn-preview');
    const pr = document.getElementById('preview-result');
    btn.disabled = true; btn.textContent = '⏳ Preview...';
    try {
        const { fd } = getVideoFormData();
        fd.append('preview_only', '1');
        const resp = await fetch('/generate-video', { method: 'POST', body: fd });
        if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Lỗi'); }
        const data = await resp.json();
        pr.innerHTML = `<img src="${data.preview_url}" style="max-width:300px;border-radius:12px;border:2px solid #ddd">
            <p style="font-size:.85em;color:#666;margin-top:4px">Preview — nhấn "Tạo Video" để render</p>`;
    } catch(e) { pr.innerHTML = `<p style="color:red">❌ ${e.message}</p>`; }
    finally { btn.disabled = false; btn.textContent = '👁️ Xem trước'; }
}

async function generateVideo() {
    const btn = document.getElementById('btn-video');
    const vr = document.getElementById('video-result');
    btn.disabled = true; btn.textContent = '⏳ Đang tạo video...'; vr.innerHTML = '';
    try {
        const { fd, platform } = getVideoFormData();
        const resp = await fetch('/generate-video', { method: 'POST', body: fd });
        if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Lỗi'); }
        const data = await resp.json();
        const label = platform === 'facebook' ? 'Facebook Reels' : 'TikTok';

            <br><a href="${data.video_url}" download class="btn" style="margin-top:8px;display:inline-block;font-size:.9em">⬇️ ${label}</a>`;

// === Template System ===
async function loadTemplateList() {
    try {
        const resp = await fetch('/api/templates');
        const data = await resp.json();
        const sel = document.getElementById('template-list');
        if (!sel) return;
        sel.innerHTML = '<option value="">Chọn template...</option>';
        (data.templates || []).forEach(t => {
            sel.innerHTML += `<option value="${t.name}">${t.name}</option>`;
        });
    } catch(e) {}
}

function getVideoConfig() {
    return {
        aspect_ratio: document.getElementById('video-aspect')?.value,
        duration: document.getElementById('video-duration')?.value,
        music_volume: document.getElementById('music-volume')?.value,
        voice_speed: document.getElementById('voice-speed')?.value,
        img_transition: document.getElementById('img-transition')?.value,
        subtitle_style: document.getElementById('subtitle-style')?.value,
        highlight_color: document.getElementById('highlight-color')?.value,
        img_effect: document.getElementById('img-effect')?.value,
        show_intro: document.getElementById('show-intro')?.checked,
        show_outro: document.getElementById('show-outro')?.checked,
        logo_position: document.getElementById('logo-position')?.value,
    };
}

function applyVideoConfig(cfg) {
    if (!cfg) return;
    const sets = {
        'video-aspect': cfg.aspect_ratio, 'video-duration': cfg.duration,
        'music-volume': cfg.music_volume, 'voice-speed': cfg.voice_speed,
        'img-transition': cfg.img_transition, 'subtitle-style': cfg.subtitle_style,
        'highlight-color': cfg.highlight_color, 'img-effect': cfg.img_effect,
        'logo-position': cfg.logo_position,
    };
    for (const [id, val] of Object.entries(sets)) {
        const el = document.getElementById(id);
        if (el && val !== undefined) el.value = val;
    }
    if (cfg.show_intro !== undefined) document.getElementById('show-intro').checked = cfg.show_intro;
    if (cfg.show_outro !== undefined) document.getElementById('show-outro').checked = cfg.show_outro;
    // Update display values
    ['dur-val','vol-val','voice-speed-val','img-speed-val'].forEach(id => {
        const el = document.getElementById(id);
        const input = el?.parentElement?.querySelector('input[type=range]');
        if (el && input) el.textContent = input.value;
    });
}

async function saveTemplate() {
    const name = document.getElementById('template-name')?.value?.trim();
    if (!name) { alert('Nhập tên template!'); return; }
    const fd = new FormData();
    fd.append('name', name);
    fd.append('config', JSON.stringify(getVideoConfig()));
    await fetch('/api/templates', { method: 'POST', body: fd });
    loadTemplateList();
}

async function loadTemplate() {
    const name = document.getElementById('template-list')?.value;
    if (!name) return;
    const resp = await fetch(`/api/templates/${name}`);
    const cfg = await resp.json();
    applyVideoConfig(cfg);
}

async function deleteTemplate() {
    const name = document.getElementById('template-list')?.value;
    if (!name) return;
    await fetch(`/api/templates/${name}`, { method: 'DELETE' });
    loadTemplateList();
}

// === Auto-cut Video ===
async function autoCutVideo() {
    const file = document.getElementById('autocut-video')?.files?.[0];
    if (!file) { alert('Chọn video trước!'); return; }
    const st = document.getElementById('autocut-status');
    st.textContent = '⏳ Đang cắt...';
    try {
        const fd = new FormData();
        fd.append('video', file);
        fd.append('max_duration', document.getElementById('video-duration')?.value || '30');
        const resp = await fetch('/auto-cut-video', { method: 'POST', body: fd });
        const data = await resp.json();
        st.textContent = `✅ ${data.original_duration}s → ${data.cut_duration}s`;
        document.getElementById('autocut-result').innerHTML = `
            <video controls style="max-width:300px;border-radius:8px"><source src="${data.video_url}" type="video/mp4"></video>
            <br><a href="${data.video_url}" download style="font-size:.85em">⬇️ Tải video đã cắt</a>`;
    } catch(e) { st.textContent = '❌ ' + e.message; }
}

// === Nova Reel AI Video ===
function setNovaPrompt(text) {
    document.getElementById('nova-prompt').value = text;
}

function previewNovaMedia(input) {
    var preview = document.getElementById('nova-media-preview');
    preview.innerHTML = '';
    // Limit to 8 files
    if (input.files.length > 8) {
        alert('Tối đa 8 files!');
        input.value = '';
        return;
    }
    Array.from(input.files).forEach(function(file, i) {
        var div = document.createElement('div');
        div.style.cssText = 'position:relative;display:inline-block';
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'nova-media-check';
        cb.dataset.index = i;
        cb.style.cssText = 'position:absolute;top:4px;left:4px;width:18px;height:18px;z-index:2';
        if (i < 2) cb.checked = true;
        cb.onchange = function() {
            var checked = document.querySelectorAll('.nova-media-check:checked');
            if (checked.length > 2) { this.checked = false; alert('Chọn tối đa 2 ảnh/video cho AI!'); }
        };
        div.appendChild(cb);
        if (file.type.startsWith('video/')) {
            var vid = document.createElement('video');
            vid.src = URL.createObjectURL(file);
            vid.style.cssText = 'height:80px;border-radius:6px';
            vid.controls = true;
            div.appendChild(vid);
        } else {
            var img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.style.cssText = 'height:80px;border-radius:6px;border:2px solid ' + (i < 2 ? '#6a0572' : 'transparent');
            div.appendChild(img);
        }
        preview.appendChild(div);
    });
}

async function novaReelGenerate() {
    const prompt = document.getElementById('nova-prompt')?.value?.trim();
    if (!prompt) { alert('Nhập mô tả video!'); return; }
    const btn = document.getElementById('btn-nova');
    const nr = document.getElementById('nova-result');
    btn.disabled = true; btn.textContent = '⏳ Đang tạo (~90s)...';
    nr.innerHTML = '<p style="font-size:.85em;color:#666">Đang gửi yêu cầu tới Nova Reel...</p>';
    try {
        const fd = new FormData();
        fd.append('prompt', prompt);
        fd.append('nova_duration', document.getElementById('nova-duration')?.value || '6');
        const novaInput = document.getElementById('nova-media');
        if (novaInput?.files) {
            const checked = new Set();
            document.querySelectorAll('.nova-media-check:checked').forEach(cb => checked.add(parseInt(cb.dataset.index)));
            for (let i = 0; i < novaInput.files.length; i++) {
                if (checked.has(i)) fd.append('nova_media', novaInput.files[i]);
            }
        }
        const resp = await fetch('/nova-reel', { method: 'POST', body: fd });
        if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || 'Lỗi'); }
        const data = await resp.json();
        nr.innerHTML = `<p style="font-size:.85em;color:#666">⏳ Video đang render... Kiểm tra sau 90 giây.</p>`;
        // Poll for completion
        const arn = data.invocation_arn;
        for (let i = 0; i < 30; i++) {
            await new Promise(ok => setTimeout(ok, 5000));
            const sr = await fetch(`/nova-reel-status?arn=${encodeURIComponent(arn)}`);
            const sd = await sr.json();
            if (sd.status === 'COMPLETED') {
                nr.innerHTML = `<p style="color:green">✅ Video tạo xong!</p>
                    <p style="font-size:.85em">S3: ${sd.s3_uri}</p>
                    <p style="font-size:.85em;color:#666">Tải video từ S3 console hoặc dùng: aws s3 cp ${sd.s3_uri} ./output/</p>`;
                break;
            } else if (sd.status === 'FAILED') {
                nr.innerHTML = `<p style="color:red">❌ Lỗi: ${sd.error}</p>`;
                break;
            }
            nr.innerHTML = `<p style="font-size:.85em;color:#666">⏳ Đang render... (${(i+1)*5}s)</p>`;
        }
    } catch(e) { nr.innerHTML = `<p style="color:red">❌ ${e.message}</p>`; }
    finally { btn.disabled = false; btn.textContent = '🎬 Tạo AI Video'; }
}

async function batchGenerate() {
    const btn = document.getElementById('btn-batch');
    const vr = document.getElementById('video-result');
    btn.disabled = true; btn.textContent = '⏳ Đang tạo 3 video...'; vr.innerHTML = '';
    const configs = [['9:16','tiktok','TikTok'],['9:16','facebook','Reels'],['9:16','tiktok','YouTube Shorts'],['16:9','facebook','YouTube']];
    let html = '';
    for (const [aspect, plat, label] of configs) {
        try {
            const { fd } = getVideoFormData();
            fd.set('aspect_ratio', aspect); fd.set('platform', plat);
            const resp = await fetch('/generate-video', { method: 'POST', body: fd });
            if (!resp.ok) throw new Error('Lỗi');
            const data = await resp.json();
            html += `<div style="display:inline-block;margin:8px;vertical-align:top">
                <video controls style="max-width:220px;border-radius:8px"><source src="${data.video_url}" type="video/mp4"></video>
                <br><a href="${data.video_url}" download class="btn" style="font-size:.8em;padding:6px 12px;margin-top:4px;display:inline-block">⬇️ ${label}</a></div>`;
            vr.innerHTML = html + '<p style="font-size:.85em;color:#666">Đang tạo...</p>';
        } catch(e) { html += `<p style="color:red;font-size:.85em">❌ ${label}: ${e.message}</p>`; }
    }
    vr.innerHTML = html;
    btn.disabled = false; btn.textContent = '📦 Tạo tất cả';
}
